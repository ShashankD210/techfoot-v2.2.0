[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "techfoot"
version = "2.2.0"
description = "Advanced Technology Footprinting & OSINT CVE Correlation Toolkit"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "TechFoot Contributors"}
]
keywords = ["osint", "cve", "fingerprinting", "security", "reconnaissance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
pdf = ["weasyprint"]

[project.scripts]
techfoot = "techfoot_cli:main"

[project.urls]
Homepage = "https://github.com/techfoot/techfoottoolkit"
Repository = "https://github.com/techfoot/techfoottoolkit"

[tool.setuptools]
packages = ["techfoot"]

[tool.setuptools.package-data]
techfoot = ["py.typed"]
